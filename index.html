<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft 网页版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: "Courier New", monospace; user-select: none; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; image-rendering: auto; }

    #crosshair {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.85); font-size: 22px; pointer-events: none;
      text-shadow: 0 0 2px #000; z-index: 5;
    }
    #hotbar {
      position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%);
      display: flex; gap: 2px; z-index: 5; pointer-events: none;
      background: rgba(0,0,0,0.35); padding: 3px; border: 2px solid rgba(0,0,0,0.6);
    }
    .slot {
      width: 46px; height: 46px; border: 2px solid #555;
      background: rgba(30,30,30,0.6); position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .slot.selected { border-color: #fff; box-shadow: 0 0 0 2px #fff inset; }
    .slot canvas { width: 36px; height: 36px; image-rendering: pixelated; }
    .slot .num { position: absolute; left: 2px; top: 0; font-size: 10px; color: #ccc; }
    #blockname {
      position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%);
      color: #fff; font-size: 14px; text-shadow: 1px 1px 0 #000;
      z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.5s;
    }
    #debug {
      position: fixed; left: 8px; top: 8px; color: #fff; font-size: 12px;
      text-shadow: 1px 1px 0 #000; z-index: 5; pointer-events: none;
      white-space: pre; display: none; background: rgba(0,0,0,0.3); padding: 4px 6px;
    }
    #menu {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(10, 14, 20, 0.82);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; text-align: center; gap: 18px;
    }
    #menu h1 {
      font-size: 44px; letter-spacing: 4px; color: #fff;
      text-shadow: 3px 3px 0 #3f3f3f;
    }
    #menu .sub { color: #ffff55; font-size: 14px; }
    #menu .keys { color: #bbb; font-size: 13px; line-height: 1.9; }
    #menu button {
      font-family: inherit; font-size: 18px; padding: 10px 46px;
      background: #6f6f6f; color: #fff; border: 2px solid;
      border-color: #a8a8a8 #4a4a4a #4a4a4a #a8a8a8;
      cursor: pointer; text-shadow: 1px 1px 0 #333;
    }
    #menu button:hover { background: #7f8fbf; }
    #menu button.small { font-size: 13px; padding: 6px 20px; background: #555; }
    #menu.hidden { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="crosshair">+</div>
  <div id="blockname"></div>
  <div id="hotbar"></div>
  <div id="debug"></div>
  <div id="menu">
    <h1>MINECRAFT</h1>
    <div class="sub">网页复刻版 · 无限方块世界</div>
    <button id="play">开始游戏</button>
    <button id="reset" class="small">清除存档并重新生成世界</button>
    <div class="keys">
      WASD 移动 · 空格 跳跃 / 双击空格 飞行 · Shift 潜行/下降 · Ctrl 疾跑<br/>
      鼠标左键 破坏方块 · 右键 放置方块 · 1-9 / 滚轮 选择方块 · F3 调试信息 · Esc 菜单
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
